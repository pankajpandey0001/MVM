# ----------------------------------------------------
# APPLICATION & SERVER SETTINGS
# ----------------------------------------------------
spring.application.name=mvm
server.port=${PORT:8080}

# ----------------------------------------------------
# DATABASE CONFIGURATION (MySQL - Aiven / Local)
# ----------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/mvm_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ----------------------------------------------------
# JPA / HIBERNATE SETTINGS
# ----------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ----------------------------------------------------
# REDIS CONFIGURATION (Upstash / Local)
# Using spring.data.redis.url handles both standard and SSL connections automatically!
# ----------------------------------------------------
spring.data.redis.url=${REDIS_URL:redis://localhost:6379}
spring.data.redis.timeout=2000

# ----------------------------------------------------
# CUSTOM JWT PROPERTIES
# ----------------------------------------------------
jwt.secret=${JWT_SECRET:myDefaultSecretKeyForLocalDevelopmentOnly123456789}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ----------------------------------------------------
# GMAIL SMTP CONFIGURATION
# ----------------------------------------------------
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ----------------------------------------------------
# SUPER ADMIN SEED CREDENTIALS
# ----------------------------------------------------
app.admin.full-name=${ADMIN_FULL_NAME:Super Admin}
app.admin.email=${ADMIN_EMAIL:admin@mvm.com}
app.admin.phone=${ADMIN_PHONE:1234567890}
app.admin.password=${ADMIN_PASSWORD:admin123}


logging.level.org.springframework.web=DEBUG
server.error.include-stacktrace=always
